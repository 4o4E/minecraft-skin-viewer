name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Release
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests and build server packages
        run: |
          bash ./gradlew \
            :core:test \
            :http-client:test \
            :http-server:test \
            :renderer-tavolo:test \
            :http-server-tavolo-win:shadowJar \
            :http-server-tavolo-linux:shadowJar \
            :http-server-opengl-win:shadowJar \
            :http-server-opengl-linux:shadowJar \
            --build-cache \
            --parallel

      - name: Run OpenGL renderer smoke test
        run: |
          bash .github/scripts/install-opengl-test-deps.sh
          xvfb-run -a bash ./gradlew :renderer-opengl:test -Dskin.openglSmoke=true --build-cache

      - name: Prepare Docker smoke fixture
        run: bash ./gradlew prepareRunAssets

      - name: Build Docker smoke images
        run: |
          docker build -t mc-skin-render:tavolo-smoke http-server-tavolo-linux
          docker build -t mc-skin-render:opengl-smoke http-server-opengl-linux

      - name: Start Tavolo Docker image
        run: |
          docker run -d --name msr-tavolo-smoke \
            -e SKIN_FIXTURE_FILE=/tmp/alex_skin.png \
            -e SKIN_FIXTURE_NAME=404E \
            -e SKIN_FIXTURE_SLIM=true \
            -e SERVER_HOST=0.0.0.0 \
            -e SERVER_PORT=8080 \
            -v "$PWD/run/alex_skin.png:/tmp/alex_skin.png:ro" \
            -p 18080:8080 \
            mc-skin-render:tavolo-smoke

      - name: Wait for Tavolo Docker data endpoint
        run: |
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:18080/data/name/404E && break
            if [ "$i" -eq 30 ]; then
              exit 1
            fi
            sleep 1
          done

      - name: Smoke test Tavolo Docker face endpoint
        run: |
          curl -fsS http://127.0.0.1:18080/face/name/404E -o tavolo-face.png
          test -s tavolo-face.png

      - name: Smoke test Tavolo Docker render endpoint
        run: |
          curl -fSv http://127.0.0.1:18080/render/name/404E/head -o tavolo-head.png
          test -s tavolo-head.png

      - name: Stop Tavolo Docker image
        if: always()
        run: |
          docker logs msr-tavolo-smoke 2>/dev/null || true
          docker rm -f msr-tavolo-smoke 2>/dev/null || true

      - name: Start OpenGL Docker image
        run: |
          docker run -d --name msr-opengl-smoke \
            -e SKIN_FIXTURE_FILE=/tmp/alex_skin.png \
            -e SKIN_FIXTURE_NAME=404E \
            -e SKIN_FIXTURE_SLIM=true \
            -e SERVER_HOST=0.0.0.0 \
            -e SERVER_PORT=8080 \
            -v "$PWD/run/alex_skin.png:/tmp/alex_skin.png:ro" \
            -p 18081:8080 \
            mc-skin-render:opengl-smoke

      - name: Wait for OpenGL Docker data endpoint
        run: |
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:18081/data/name/404E && break
            if [ "$i" -eq 30 ]; then
              exit 1
            fi
            sleep 1
          done

      - name: Smoke test OpenGL Docker face endpoint
        run: |
          curl --retry 3 --retry-delay 1 --retry-all-errors -fsS http://127.0.0.1:18081/face/name/404E -o opengl-face.png
          test -s opengl-face.png

      - name: Smoke test OpenGL Docker render endpoint
        run: |
          curl -fSv http://127.0.0.1:18081/render/name/404E/head -o opengl-head.png
          test -s opengl-head.png

      - name: Stop OpenGL Docker image
        if: always()
        run: |
          docker logs msr-opengl-smoke 2>/dev/null || true
          docker rm -f msr-opengl-smoke 2>/dev/null || true

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp http-server-tavolo-win/build/libs/http-server-tavolo-win.jar release-assets/
          cp http-server-tavolo-linux/build/libs/http-server-tavolo-linux.jar release-assets/
          cp http-server-opengl-win/build/libs/http-server-opengl-win.jar release-assets/
          cp http-server-opengl-linux/build/libs/http-server-opengl-linux.jar release-assets/

      - name: Publish Maven packages
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Maven Central publish must run from a git tag without v prefix" >&2
            exit 1
          fi

          VERSION="$(bash ./gradlew -q printVersion)"
          if [[ "$VERSION" == v* ]]; then
            echo "Release tag must not use v prefix: $VERSION" >&2
            exit 1
          fi

          CENTRAL_TASK="publishAndReleaseToMavenCentral"

          bash ./gradlew \
            :core:publishAllPublicationsToNexusRepository \
            :http-client:publishAllPublicationsToNexusRepository \
            :renderer-tavolo:publishAllPublicationsToNexusRepository \
            :renderer-opengl:publishAllPublicationsToNexusRepository \
            --build-cache \
            --parallel

          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "Snapshot version only publishes to Nexus"
          else
            bash ./gradlew \
              :core:${CENTRAL_TASK} \
              :http-client:${CENTRAL_TASK} \
              :renderer-tavolo:${CENTRAL_TASK} \
              :renderer-opengl:${CENTRAL_TASK} \
              --build-cache \
              --parallel
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Tavolo Linux image
        uses: docker/build-push-action@v7
        with:
          context: http-server-tavolo-linux
          push: true
          cache-from: type=gha,scope=tavolo-linux
          cache-to: type=gha,mode=max,scope=tavolo-linux
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/mc-skin-render-tavolo-linux:${{ github.ref_name }}
            ghcr.io/${{ env.OWNER_LC }}/mc-skin-render-tavolo-linux:latest

      - name: Build and push OpenGL Linux image
        uses: docker/build-push-action@v7
        with:
          context: http-server-opengl-linux
          push: true
          cache-from: type=gha,scope=opengl-linux
          cache-to: type=gha,mode=max,scope=opengl-linux
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/mc-skin-render-opengl-linux:${{ github.ref_name }}
            ghcr.io/${{ env.OWNER_LC }}/mc-skin-render-opengl-linux:latest

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          files: release-assets/*.jar
          generate_release_notes: true
