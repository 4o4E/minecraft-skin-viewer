name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Release
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests and build server packages
        run: |
          bash ./gradlew \
            :core:test \
            :http-client:test \
            :http-server:test \
            :renderer-tavolo:test \
            :http-server-tavolo-win:shadowJar \
            :http-server-tavolo-linux:shadowJar \
            :http-server-opengl-win:shadowJar \
            :http-server-opengl-linux:shadowJar \
            --build-cache \
            --parallel

      - name: Run OpenGL renderer smoke test
        run: |
          bash .github/scripts/install-opengl-test-deps.sh
          xvfb-run -a bash ./gradlew :renderer-opengl:test -Dskin.openglSmoke=true --build-cache

      - name: Prepare Docker smoke fixture
        run: bash ./gradlew prepareRunAssets

      - name: Build Docker smoke images
        run: |
          docker build -t minecraft-skin-viewer:tavolo-smoke http-server-tavolo-linux
          docker build -t minecraft-skin-viewer:opengl-smoke http-server-opengl-linux

      - name: Start Tavolo Docker image
        run: |
          docker run -d --name msv-tavolo-smoke \
            -e SKIN_FIXTURE_FILE=/tmp/alex_skin.png \
            -e SKIN_FIXTURE_NAME=404E \
            -e SKIN_FIXTURE_SLIM=true \
            -e SERVER_HOST=0.0.0.0 \
            -e SERVER_PORT=8080 \
            -v "$PWD/run/alex_skin.png:/tmp/alex_skin.png:ro" \
            -p 18080:8080 \
            minecraft-skin-viewer:tavolo-smoke

      - name: Wait for Tavolo Docker data endpoint
        run: |
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:18080/data/name/404E && break
            if [ "$i" -eq 30 ]; then
              exit 1
            fi
            sleep 1
          done

      - name: Smoke test Tavolo Docker face endpoint
        run: |
          curl -fsS http://127.0.0.1:18080/face/name/404E -o tavolo-face.png
          test -s tavolo-face.png

      - name: Smoke test Tavolo Docker render endpoint
        run: |
          curl -fSv http://127.0.0.1:18080/render/name/404E/head -o tavolo-head.png
          test -s tavolo-head.png

      - name: Stop Tavolo Docker image
        if: always()
        run: |
          docker logs msv-tavolo-smoke 2>/dev/null || true
          docker rm -f msv-tavolo-smoke 2>/dev/null || true

      - name: Start OpenGL Docker image
        run: |
          docker run -d --name msv-opengl-smoke \
            -e SKIN_FIXTURE_FILE=/tmp/alex_skin.png \
            -e SKIN_FIXTURE_NAME=404E \
            -e SKIN_FIXTURE_SLIM=true \
            -e SERVER_HOST=0.0.0.0 \
            -e SERVER_PORT=8080 \
            -v "$PWD/run/alex_skin.png:/tmp/alex_skin.png:ro" \
            -p 18081:8080 \
            minecraft-skin-viewer:opengl-smoke

      - name: Wait for OpenGL Docker data endpoint
        run: |
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:18081/data/name/404E && break
            if [ "$i" -eq 30 ]; then
              exit 1
            fi
            sleep 1
          done

      - name: Smoke test OpenGL Docker face endpoint
        run: |
          curl --retry 3 --retry-delay 1 --retry-all-errors -fsS http://127.0.0.1:18081/face/name/404E -o opengl-face.png
          test -s opengl-face.png

      - name: Smoke test OpenGL Docker render endpoint
        run: |
          curl -fSv http://127.0.0.1:18081/render/name/404E/head -o opengl-head.png
          test -s opengl-head.png

      - name: Stop OpenGL Docker image
        if: always()
        run: |
          docker logs msv-opengl-smoke 2>/dev/null || true
          docker rm -f msv-opengl-smoke 2>/dev/null || true

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp http-server-tavolo-win/build/libs/http-server-tavolo-win.jar release-assets/
          cp http-server-tavolo-linux/build/libs/http-server-tavolo-linux.jar release-assets/
          cp http-server-opengl-win/build/libs/http-server-opengl-win.jar release-assets/
          cp http-server-opengl-linux/build/libs/http-server-opengl-linux.jar release-assets/

      - name: Publish Maven packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash ./gradlew \
            :core:publish \
            :http-client:publish \
            :renderer-tavolo:publish \
            :renderer-opengl:publish \
            --build-cache \
            --parallel

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Tavolo Linux image
        uses: docker/build-push-action@v7
        with:
          context: http-server-tavolo-linux
          push: true
          cache-from: type=gha,scope=tavolo-linux
          cache-to: type=gha,mode=max,scope=tavolo-linux
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/minecraft-skin-viewer-tavolo-linux:${{ github.ref_name }}
            ghcr.io/${{ env.OWNER_LC }}/minecraft-skin-viewer-tavolo-linux:latest

      - name: Build and push OpenGL Linux image
        uses: docker/build-push-action@v7
        with:
          context: http-server-opengl-linux
          push: true
          cache-from: type=gha,scope=opengl-linux
          cache-to: type=gha,mode=max,scope=opengl-linux
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/minecraft-skin-viewer-opengl-linux:${{ github.ref_name }}
            ghcr.io/${{ env.OWNER_LC }}/minecraft-skin-viewer-opengl-linux:latest

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          files: release-assets/*.jar
          generate_release_notes: true
